name: Go

on: [push, pull_request]

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    name: Vet and test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libolm
        run: sudo apt-get install libolm-dev libolm3

      - name: Vet
        run: go vet ./...

      - name: Test
        # pkg/gotd/tgtest's TestSessionHandle times out on upstream v0.2611.0 as well, it's left out.
        run: go test $(go list ./... | grep -v /pkg/gotd/tgtest)
