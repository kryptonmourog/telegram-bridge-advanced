name: Go

on: [push, pull_request]

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    name: Vet and test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libolm
        run: sudo apt-get install libolm-dev libolm3

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
