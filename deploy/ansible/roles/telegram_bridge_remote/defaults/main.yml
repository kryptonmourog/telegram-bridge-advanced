---
telegram_bridge_base_path: /opt/mautrix-telegram
telegram_bridge_data_path: "{{ telegram_bridge_base_path }}/data"
telegram_bridge_backup_path: "{{ telegram_bridge_base_path }}/backups"

telegram_bridge_image: ""
telegram_bridge_image_source: registry
telegram_bridge_container_name: mautrix-telegram

telegram_homeserver_url: ""
telegram_homeserver_domain: ""
telegram_homeserver_hostname: ""
telegram_api_id: 0
telegram_api_hash: ""
telegram_bridge_permissions: {}

telegram_bridge_appservice_id: telegram
telegram_bridge_bot_username: telegrambot
telegram_bridge_username_template: "telegram_{{ '{{.}}' }}"
telegram_bridge_command_prefix: "!tg"
telegram_bridge_database_uri: "file:/data/mautrix-telegram.db?_txlock=immediate"
telegram_bridge_config_overlay_custom: {}
telegram_bridge_regenerate_registration: false

telegram_bridge_encryption_enabled: false
telegram_bridge_encryption_personal: false
telegram_bridge_encryption_default: false
telegram_bridge_encryption_require: false
telegram_bridge_encryption_key_sharing: true

telegram_direct_media_enabled: true
telegram_direct_media_scope: channels
telegram_media_hostname: ""
telegram_media_id_prefix: tg_
telegram_media_server_implementation_name: ""
telegram_media_server_implementation_version: ""
telegram_media_tunnel_auth: ""
telegram_chisel_image: jpillora/chisel:1.12.0
