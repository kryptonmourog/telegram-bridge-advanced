---
- name: Validate bridge settings
  ansible.builtin.assert:
    that:
      - telegram_homeserver_url | length > 0
      - telegram_homeserver_domain | length > 0
      - telegram_homeserver_hostname | length > 0
      - telegram_api_id | int > 0
      - telegram_api_hash | length > 0
      - telegram_bridge_permissions | length > 0
      - telegram_direct_media_scope in ['all', 'channels', 'off']
      - not telegram_direct_media_enabled | bool or telegram_media_hostname | length > 0
      - >-
        not telegram_direct_media_enabled | bool or
        (telegram_media_tunnel_auth | length >= 16 and ':' in telegram_media_tunnel_auth)
    fail_msg: Check the Telegram bridge variables in group_vars.
  no_log: true

- name: Install the bridge image
  ansible.builtin.include_role:
    name: _docker_image
  vars:
    companion_image_name: "{{ telegram_bridge_image }}"
    companion_image_source: "{{ telegram_bridge_image_source }}"

- name: Pull the Chisel image
  community.docker.docker_image_pull:
    name: "{{ telegram_chisel_image }}"
  when:
    - telegram_direct_media_enabled | bool
    - not ansible_check_mode

- name: Create bridge directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ telegram_bridge_base_path }}", mode: "0750"}
    - {path: "{{ telegram_bridge_data_path }}", mode: "0700"}
    - {path: "{{ telegram_bridge_backup_path }}", mode: "0700"}

- name: Write bridge compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ telegram_bridge_base_path }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  register: telegram_bridge_compose_file

- name: Write bridge environment file
  ansible.builtin.copy:
    content: |
      CHISEL_AUTH={{ telegram_media_tunnel_auth }}
    dest: "{{ telegram_bridge_base_path }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: telegram_direct_media_enabled | bool

- name: Check for an existing bridge config
  ansible.builtin.stat:
    path: "{{ telegram_bridge_data_path }}/config.yaml"
  register: telegram_bridge_config_stat

- name: Generate the default bridge config
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volume
      - "{{ telegram_bridge_data_path }}:/data"
      - "{{ telegram_bridge_image }}"
  when:
    - not telegram_bridge_config_stat.stat.exists
    - not ansible_check_mode
  register: telegram_bridge_config_generated
  changed_when: true

- name: Build the managed config overlay
  ansible.builtin.set_fact:
    telegram_bridge_managed_config: >-
      {{ telegram_bridge_managed_config_base |
         combine(telegram_bridge_config_overlay_custom, recursive=True) }}
  vars:
    telegram_bridge_managed_config_base:
      homeserver:
        address: "{{ telegram_homeserver_url }}"
        domain: "{{ telegram_homeserver_domain }}"
        websocket: true
        ping_interval_seconds: 30
      appservice:
        address: http://0.0.0.0:29317
        public_address: >-
          {{ ('https://' + telegram_media_hostname) if telegram_direct_media_enabled | bool else '' }}
        hostname: 0.0.0.0
        port: 29317
        id: "{{ telegram_bridge_appservice_id }}"
        bot:
          username: "{{ telegram_bridge_bot_username }}"
        username_template: "{{ telegram_bridge_username_template }}"
      database:
        type: sqlite3-fk-wal
        uri: "{{ telegram_bridge_database_uri }}"
      bridge:
        command_prefix: "{{ telegram_bridge_command_prefix }}"
        permissions: "{{ telegram_bridge_permissions }}"
      network:
        api_id: "{{ telegram_api_id | int }}"
        api_hash: "{{ telegram_api_hash }}"
        direct_media_scope: "{{ telegram_direct_media_scope }}"
      encryption:
        allow: "{{ telegram_bridge_encryption_enabled | bool }}"
        default: "{{ telegram_bridge_encryption_default | bool }}"
        personal: "{{ telegram_bridge_encryption_personal | bool }}"
        require: "{{ telegram_bridge_encryption_require | bool }}"
        appservice: "{{ telegram_bridge_encryption_enabled | bool }}"
        msc4190: "{{ telegram_bridge_encryption_enabled | bool }}"
        self_sign: "{{ telegram_bridge_encryption_enabled | bool }}"
        allow_key_sharing: "{{ telegram_bridge_encryption_key_sharing | bool }}"
      direct_media:
        enabled: "{{ telegram_direct_media_enabled | bool }}"
        server_name: "{{ telegram_media_hostname }}"
        media_id_prefix: "{{ telegram_media_id_prefix }}"
        server_implementation_name: "{{ telegram_media_server_implementation_name }}"
        server_implementation_version: "{{ telegram_media_server_implementation_version }}"
  no_log: true

- name: Write the managed config overlay
  ansible.builtin.copy:
    content: "{{ telegram_bridge_managed_config | to_nice_yaml(indent=4, sort_keys=false) }}"
    dest: "{{ telegram_bridge_data_path }}/.ansible-overlay.yaml"
    owner: root
    group: root
    mode: "0600"
  register: telegram_bridge_overlay_file
  no_log: true

- name: Merge managed settings into the bridge config
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - yq
      - --volume
      - "{{ telegram_bridge_data_path }}:/data"
      - "{{ telegram_bridge_image }}"
      - eval-all
      - --inplace
      - select(fileIndex == 0) * select(fileIndex == 1)
      - /data/config.yaml
      - /data/.ansible-overlay.yaml
  when:
    - telegram_bridge_overlay_file.changed or telegram_bridge_config_generated.changed | default(false)
    - not ansible_check_mode
  no_log: true
  changed_when: true

- name: Check for an existing appservice registration
  ansible.builtin.stat:
    path: "{{ telegram_bridge_data_path }}/registration.yaml"
  register: telegram_bridge_registration_stat

- name: Back up the registration before regeneration
  ansible.builtin.copy:
    src: "{{ telegram_bridge_data_path }}/registration.yaml"
    dest: "{{ telegram_bridge_backup_path }}/registration-before-ansible.yaml"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  when:
    - telegram_bridge_registration_stat.stat.exists
    - telegram_bridge_regenerate_registration | bool
  no_log: true

- name: Remove the old registration when regeneration is requested
  ansible.builtin.file:
    path: "{{ telegram_bridge_data_path }}/registration.yaml"
    state: absent
  when: telegram_bridge_regenerate_registration | bool

- name: Generate the appservice registration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volume
      - "{{ telegram_bridge_data_path }}:/data"
      - "{{ telegram_bridge_image }}"
  when:
    - not telegram_bridge_registration_stat.stat.exists or telegram_bridge_regenerate_registration | bool
    - not ansible_check_mode
  no_log: true
  changed_when: true

- name: Read the appservice registration for wsproxy
  ansible.builtin.slurp:
    src: "{{ telegram_bridge_data_path }}/registration.yaml"
  register: telegram_bridge_registration_slurp
  no_log: true
  when: not ansible_check_mode

- name: Keep the registration for the Matrix play
  ansible.builtin.set_fact:
    telegram_bridge_registration: "{{ telegram_bridge_registration_slurp.content | b64decode | from_yaml }}"
  no_log: true
  when: not ansible_check_mode

- name: Start the remote bridge
  community.docker.docker_compose_v2:
    project_src: "{{ telegram_bridge_base_path }}"
    state: present
    pull: never
    remove_orphans: true
  when: not ansible_check_mode
