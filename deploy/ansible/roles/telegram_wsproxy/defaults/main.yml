---
telegram_wsproxy_base_path: /opt/matrix-telegram-wsproxy
telegram_wsproxy_image: dock.mau.dev/mautrix/wsproxy:latest
telegram_wsproxy_image_source: registry
telegram_wsproxy_container_name: matrix-telegram-wsproxy
telegram_wsproxy_port: 29331
telegram_wsproxy_path: /_matrix/client/unstable/fi.mau.as_sync
telegram_wsproxy_synapse_network: matrix-homeserver
telegram_traefik_network: traefik
telegram_traefik_entrypoint: web-secure
telegram_traefik_cert_resolver: default
telegram_synapse_uid: 991
telegram_synapse_gid: 991
telegram_homeserver_hostname: ""
telegram_bridge_encryption_enabled: false
