---
- name: Install the remote Telegram bridge
  hosts: telegram_bridge_servers
  become: true
  gather_facts: false
  roles:
    - role: telegram_bridge_remote
      tags: [telegram_bridge]

- name: Install Matrix-side services for the remote Telegram bridge
  hosts: matrix_servers
  become: true
  gather_facts: false
  roles:
    - role: telegram_wsproxy
      tags: [telegram_wsproxy]
    - role: telegram_media_gateway
      when: telegram_direct_media_enabled | bool
      tags: [telegram_media]
