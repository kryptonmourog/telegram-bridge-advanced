---
- name: Check the remote Telegram bridge
  hosts: telegram_bridge_servers
  become: true
  gather_facts: false
  tasks:
    - name: Inspect bridge containers
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop: >-
        {{ ['mautrix-telegram'] +
           (['mautrix-telegram-media-tunnel'] if telegram_direct_media_enabled | bool else []) }}
      register: telegram_bridge_container_info
      failed_when: >-
        not telegram_bridge_container_info.container.State.Running | default(false)

- name: Check Matrix-side Telegram services
  hosts: matrix_servers
  become: true
  gather_facts: false
  tasks:
    - name: Inspect Matrix-side containers
      community.docker.docker_container_info:
        name: "{{ item }}"
      loop: >-
        {{ ['matrix-telegram-wsproxy'] +
           (['matrix-telegram-media-tunnel', 'matrix-telegram-media']
            if telegram_direct_media_enabled | bool else []) }}
      register: telegram_matrix_container_info
      failed_when: >-
        not telegram_matrix_container_info.container.State.Running | default(false)

    - name: Check the media federation version
      ansible.builtin.uri:
        url: "https://{{ telegram_media_hostname }}/_matrix/federation/v1/version"
        return_content: true
        status_code: 200
      register: telegram_media_version_response
      failed_when: >-
        telegram_media_version_response.status != 200 or
        ((telegram_media_server_implementation_name | default('') | length > 0) and
         telegram_media_version_response.json.server.name != telegram_media_server_implementation_name) or
        ((telegram_media_server_implementation_version | default('') | length > 0) and
         (telegram_media_version_response.json.server.version | string) !=
         (telegram_media_server_implementation_version | string))
      when: telegram_direct_media_enabled | bool
